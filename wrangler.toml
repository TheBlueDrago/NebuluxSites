# Nebulux Sites. Deploy: npx wrangler deploy
# Secrets to add (Cloudflare dashboard -> this Worker -> Settings -> Variables and secrets, or `npx wrangler secret put NAME`):
#   RESEND_API_KEY  sends the sign-in codes (the same Resend key as Nebulux AI works)
#   ADMIN_KEY       a long password of your choice for /admin.html
#   OWNER_EMAIL     (optional) where new-order emails go
name = "nebuluxsites"
main = "src/worker.js"
compatibility_date = "2026-09-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nebulux-sites"
database_id = "f4701b31-d88d-4ab0-8074-8c7c57ede56b"

[observability]
enabled = true
