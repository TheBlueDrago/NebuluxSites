# Nebulux Sites. Deploy: npx wrangler deploy
keep_vars = true
# Secrets to add (Cloudflare dashboard -> this Worker -> Settings -> Variables and secrets, or `npx wrangler secret put NAME`):
#   RESEND_API_KEY  sends the sign-in codes (the same Resend key as Nebulux AI works)
#   ADMIN_KEY       a long password of your choice for /admin.html
#   OWNER_EMAIL     (optional) where new-order emails go
name = "nebuluxsites"
main = "src/worker.js"
compatibility_date = "2026-09-22"

# The site is down for everyone but the owner while this is "on" (owner link: /owner). Set to "off" to open it.
[vars]
MAINTENANCE = "on"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nebulux-sites"
database_id = "f4701b31-d88d-4ab0-8074-8c7c57ede56b"

[observability]
enabled = true

# Nebulux AI's database: new orders are copied here so they show on the Nebulux AI Monitor.
[[d1_databases]]
binding = "AIDB"
database_name = "nebulux-db"
database_id = "98651468-6280-498a-8641-b24d1725e6f9"
