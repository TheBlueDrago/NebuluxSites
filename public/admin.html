<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Orders · Nebulux Sites admin</title>
<link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><a class="logo" href="/"><img src="/logo.png" alt="">Nebulux Sites · Admin</a></header>
<main>
  <div class="box" id="keyBox"><h2 style="margin:0 0 8px;text-align:left">Admin</h2><p class="muted">Enter your admin key (the ADMIN_KEY secret on the Worker).</p><input id="key" type="password"><button class="btn" style="margin-top:12px" id="go">Open orders</button><p class="err" id="err"></p></div>
  <div class="box wide" id="promos" style="display:none">
    <h2 style="margin:0 0 6px;text-align:left">Promo codes</h2>
    <p class="muted">A percentage off a website's price. Customers type it on the Billing page (one code per order).</p>
    <div class="row" style="margin-top:10px"><input id="pcode" placeholder="CODE" maxlength="24" style="width:150px;text-transform:uppercase"><input id="ppct" type="number" min="1" max="90" placeholder="% off" style="width:100px"><input id="pmax" type="number" min="0" placeholder="Max uses (0 = no limit)" style="width:200px"><input id="pdays" type="number" min="0" placeholder="Days it works (0 = forever)" style="width:210px"><button class="btn" id="padd">Add code</button></div>
    <p class="err" id="perr"></p><div id="plist"></div>
  </div>
  <div class="box wide" id="list" style="display:none"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let KEY = sessionStorage.getItem("ns-admin") || "";
const call = (url, body) => fetch(url, { method: body ? "POST" : "GET", headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined }).then(async (r) => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }));
async function load() {
  const r = await call("/api/admin/orders");
  if (!r.ok) { $("err").textContent = r.error; $("keyBox").style.display = ""; $("list").style.display = "none"; return; }
  sessionStorage.setItem("ns-admin", KEY); $("keyBox").style.display = "none"; $("list").style.display = ""; promos();
  $("list").innerHTML = `<h2 style="margin:0 0 12px;text-align:left">Orders (${r.orders.length})</h2>` + (r.orders.map((o) => `
    <div class="card" style="margin-bottom:12px">
      <div class="row" style="justify-content:space-between"><b>${esc(o.id)} · ${esc(o.package)} · ${esc(o.kind)}</b><span><span class="tag">${esc(o.status)}</span>${o.claimed ? ` <span class="tag" style="background:#166534">says they paid</span>` : ""}</span></div>
      <p class="muted">${esc(o.name)} · <a href="mailto:${esc(o.email)}">${esc(o.email)}</a> · ${new Date(o.created_at).toLocaleString()}${o.deadline ? " · needed by " + esc(o.deadline) : ""}</p>
      <p style="white-space:pre-wrap;margin:8px 0">${esc(o.details)}</p>
      ${o.pages ? `<p class="muted">Pages: ${esc(o.pages)}</p>` : ""}${o.links ? `<p class="muted">Links: ${esc(o.links)}</p>` : ""}
      ${o.status === "in review" ? `<div class="row" style="margin:6px 0 10px"><button class="btn" data-acc="${esc(o.id)}">✓ Accept</button><button class="btn ghost" data-dec="${esc(o.id)}">✕ Decline</button></div>` : ""}
      <p class="muted" style="font-size:13px">Paid so far: $${(o.paid_total || 0).toFixed(2)} of $${o.price || 0}</p>
      <div class="row" style="margin-top:8px">
        <select data-s="${esc(o.id)}" style="width:auto">${r.statuses.map((s) => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select>
        <input data-p="${esc(o.id)}" value="${o.price || ""}" placeholder="Price $" style="width:110px">
        <input data-l="${esc(o.id)}" value="${esc(o.pay_link)}" placeholder="Backup payment link (only if card payments aren't set up)" style="flex:1;min-width:200px">
      </div>
      <div class="row" style="margin-top:8px"><label style="margin:0">Progress</label><input data-g="${esc(o.id)}" type="number" min="0" max="100" value="${o.progress || 0}" style="width:90px">%<input data-v="${esc(o.id)}" value="${esc(o.preview_url)}" placeholder="Preview link (https://…)" style="flex:1;min-width:200px"></div>
      <label style="margin:10px 0 4px">Live preview: paste the website's HTML (or load a file). The customer sees it on their account.</label>
      <textarea data-h="${esc(o.id)}" style="min-height:90px;font-family:monospace;font-size:13px" placeholder="<!DOCTYPE html>…">${esc(o.preview_html)}</textarea>
      <input type="file" accept=".html,.htm" data-f="${esc(o.id)}" style="margin-top:6px">
      <input data-z="${esc(o.id)}" value="${esc(o.zip_url)}" placeholder="ZIP download link for the finished website (https://…, shown when complete)" style="margin-top:8px">
      <input data-n="${esc(o.id)}" value="${esc(o.note)}" placeholder="Update the customer sees (each new one is added to their timeline)" style="margin-top:8px">
      <button class="btn" style="margin-top:8px" data-save="${esc(o.id)}">Save</button> <span class="ok" data-ok="${esc(o.id)}"></span>
    </div>`).join("") || '<p class="muted">No orders yet.</p>');
  document.querySelectorAll("[data-f]").forEach((f) => (f.onchange = async () => { const file = f.files[0]; if (file) document.querySelector(`[data-h="${f.dataset.f}"]`).value = await file.text(); }));
  const quick = (id, status) => call("/api/admin/order", { id, status, price: document.querySelector(`[data-p="${id}"]`).value, pay_link: document.querySelector(`[data-l="${id}"]`).value, note: document.querySelector(`[data-n="${id}"]`).value, progress: document.querySelector(`[data-g="${id}"]`).value, preview_url: document.querySelector(`[data-v="${id}"]`).value }).then(load);
  document.querySelectorAll("[data-acc]").forEach((b) => (b.onclick = () => quick(b.dataset.acc, "awaiting deposit")));
  document.querySelectorAll("[data-dec]").forEach((b) => (b.onclick = () => confirm("Decline and delete this request? They get an email, and it disappears for both of you.") && quick(b.dataset.dec, "cancelled")));
  document.querySelectorAll("[data-save]").forEach((b) => (b.onclick = async () => {
    const id = b.dataset.save, q = (k) => document.querySelector(`[data-${k}="${id}"]`).value;
    const res = await call("/api/admin/order", { id, status: q("s"), price: q("p"), pay_link: q("l"), note: q("n"), progress: q("g"), preview_url: q("v"), preview_html: q("h"), zip_url: q("z") });
    document.querySelector(`[data-ok="${id}"]`).textContent = res.ok ? "Saved" : res.error;
  }));
}
async function promos(body) {
  const r = await call("/api/admin/promos", body);
  if (!r.ok) { $("perr").textContent = r.error || ""; return; }
  $("perr").textContent = ""; $("promos").style.display = "";
  $("plist").innerHTML = r.promos.length ? `<table><tr><th>Code</th><th>Off</th><th>Used</th><th>Ends</th><th></th></tr>${r.promos.map((p) => `<tr><td><b>${esc(p.code)}</b>${p.active ? "" : ' <span class="tag">off</span>'}</td><td>${p.percent}%</td><td>${p.uses}${p.max_uses ? " / " + p.max_uses : ""}</td><td>${p.expires ? new Date(p.expires).toLocaleDateString() : "never"}</td><td><button class="btn ghost" data-pt="${esc(p.code)}">${p.active ? "Turn off" : "Turn on"}</button> <button class="btn ghost" data-pd="${esc(p.code)}">Delete</button></td></tr>`).join("")}</table>` : '<p class="muted">No codes yet.</p>';
  document.querySelectorAll("[data-pt]").forEach((b) => (b.onclick = () => promos({ action: "toggle", code: b.dataset.pt })));
  document.querySelectorAll("[data-pd]").forEach((b) => (b.onclick = () => confirm("Delete " + b.dataset.pd + "?") && promos({ action: "delete", code: b.dataset.pd })));
}
$("padd").onclick = () => promos({ action: "create", code: $("pcode").value, percent: $("ppct").value, max_uses: $("pmax").value, days: $("pdays").value });
$("go").onclick = () => { KEY = $("key").value; load(); };
if (KEY) load();
</script>
</body>
</html>
