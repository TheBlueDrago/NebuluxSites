<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Billing · Nebulux Sites</title>
<link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css">
<style>
.bill{max-width:560px;margin:6vh auto}
.bill .box{margin:0}
.amt{font-size:56px;font-weight:900;letter-spacing:-.02em;margin:8px 0 2px}
.lines{margin:18px 0;border-top:1px solid var(--line)}.lines div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted)}.lines b{color:var(--text)}
#pp{margin-top:20px;min-height:50px}
.secure{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13px;margin-top:14px}
.done{text-align:center}.done .big{font-size:64px}
</style>
</head>
<body>
<header><a class="logo" href="/"><img src="/logo.png" alt="">Nebulux Sites</a><nav><a href="/account.html">← My account</a></nav></header>
<main class="bill">
  <div class="box" id="card"><p class="muted">Loading…</p></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const id = new URLSearchParams(location.search).get("id") || "";
const post = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(async (r) => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }));
const money = (n) => "$" + Number(n || 0).toFixed(2).replace(/\.00$/, "");
function done(r) {
  $("card").innerHTML = `<div class="done"><div class="big">🎉</div><h2 style="margin:6px 0">Payment received!</h2><p class="muted">${r.status === "building" ? "Thank you! We're starting on your website now. Watch it come together on your account page." : r.left > 0 ? `Thank you! ${money(r.left)} is left to pay.` : "Thank you! Your website is fully paid. Download it from your account page."}</p><a class="btn" style="margin-top:18px" href="/account.html">Go to my account</a></div>`;
}
async function start() {
  const r = await fetch("/api/billing?id=" + encodeURIComponent(id)).then(async (x) => ({ ok: x.ok, status: x.status, ...(await x.json().catch(() => ({}))) }));
  if (r.status === 401) { location.href = "/account.html"; return; }
  if (!r.ok) { $("card").innerHTML = `<h2 style="margin:0 0 8px;text-align:left">Billing</h2><p class="err">${esc(r.error || "Something went wrong.")}</p>`; return; }
  const o = r.order;
  if (!r.amount) {
    $("card").innerHTML = `<h2 style="margin:0 0 8px;text-align:left">Billing · ${esc(o.id)}</h2><p class="muted">${o.status === "in review" ? "We're still looking at your request. You'll get an email when we accept it, and then you can pay here." : "There's nothing to pay right now. Thank you!"}</p><div class="lines"><div><span>Paid so far</span><b>${money(r.paid)}</b></div><div><span>Left to pay</span><b>${money(r.left)}</b></div></div><a class="btn ghost" href="/account.html">Back to my account</a>`;
    return;
  }
  $("card").innerHTML = `
    <span class="tag">${esc(o.id)}</span>
    <h2 style="margin:12px 0 0;text-align:left">${r.due === "deposit" ? "Pay your starting fee" : "Pay for your website"}</h2>
    <p class="muted">${esc(o.kind || "Your website")}</p>
    <div class="amt">${money(r.amount)}</div><p class="muted">${esc(r.label)}${r.due === "deposit" ? " · comes off your price" : ""}</p>
    <div class="lines">
      <div><span>Website price</span><b>${money(o.price)}</b></div>
      <div><span>Paid so far</span><b>${money(r.paid)}</b></div>
      <div><span>Paying now</span><b>${money(r.amount)}</b></div>
      <div><span>Left after this</span><b>${money(Math.max(0, r.left - r.amount))}</b></div>
    </div>
    <div id="pp"></div><p class="err" id="err"></p>
    <div class="secure">🔒 Secure checkout with PayPal. Pay with your card or PayPal account. We never see your card details.</div>`;
  if (!r.paypal) {
    $("pp").innerHTML = r.pay_link ? `<a class="btn" style="width:100%" href="${esc(r.pay_link)}" target="_blank" rel="noopener noreferrer">Pay ${money(r.amount)}</a>` : `<p class="muted">Online payments are being set up. We'll email you as soon as you can pay here.</p>`;
    return;
  }
  const s = document.createElement("script");
  s.src = "https://www.paypal.com/sdk/js?client-id=" + encodeURIComponent(r.paypal) + "&currency=USD&intent=capture";
  s.onload = () => paypal.Buttons({
    style: { shape: "pill", color: "gold", label: "pay", height: 48 },
    createOrder: async () => { $("err").textContent = ""; const c = await post("/api/pay/create", { id }); if (!c.ok) { $("err").textContent = c.error; throw new Error(c.error); } return c.ppid; },
    onApprove: async (d) => { $("pp").innerHTML = '<p class="muted">Confirming your payment…</p>'; const c = await post("/api/pay/capture", { id, ppid: d.orderID }); if (c.ok) done(c); else { $("err").textContent = c.error || "The payment didn't go through."; setTimeout(start, 2500); } },
    onError: () => { $("err").textContent = "PayPal had a problem. Please try again."; },
  }).render("#pp");
  s.onerror = () => { $("err").textContent = "Couldn't load PayPal. Check your internet and refresh."; };
  document.head.appendChild(s);
}
start();
</script>
<script src="/help.js" defer></script>
</body>
</html>
