<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#05040f"><meta name="robots" content="noindex">
<title>Billing · Nebulux Sites</title>
<link rel="icon" href="/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lux.css">
<style>
.bill{max-width:560px;margin:6vh auto}
.bill .box{margin:0}
.amt{font-size:56px;font-weight:900;letter-spacing:-.02em;margin:8px 0 2px}
.lines{margin:18px 0;border-top:1px solid var(--line)}.lines div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted)}.lines b{color:var(--text)}
.flab{display:block;font-weight:700;margin:18px 0 8px}.fbox{min-height:44px}.paybtn{width:100%;margin-top:22px;padding:16px;font-size:17px}
.secure{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13px;margin-top:14px}
.done{text-align:center}.done .big{font-size:64px}
</style>
</head>
<body>
<header><a class="logo" href="/account.html#dash"><img src="/logo.png" alt="">Nebulux Sites</a><nav><a href="/account.html">← My account</a></nav></header>
<main class="bill">
  <div class="box" id="card"><p class="muted">Loading…</p></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const id = new URLSearchParams(location.search).get("id") || "";
const buy = new URLSearchParams(location.search).get("buy") || "";
const post = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(async (r) => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }));
const money = (n) => "$" + Number(n || 0).toFixed(2).replace(/\.00$/, "");
function done(r) {
  if (r.update) { $("card").innerHTML = `<div class="done"><div class="big">🛠️</div><h2 style="margin:6px 0">Update paid!</h2><p class="muted">Thanks! We're working on your update and will email you when it's done.</p><a class="btn" style="margin-top:18px" href="/account.html#mon">Back to Monitor</a></div>`; return; }
  if (r.messages) { $("card").innerHTML = `<div class="done"><div class="big">💬</div><h2 style="margin:6px 0">${r.messages} more messages added!</h2><p class="muted">Go back to your order to keep chatting with us.</p><a class="btn" style="margin-top:18px" href="/account.html#dash">Back to my dashboard</a></div>`; return; }
  $("card").innerHTML = `<div class="done"><div class="big">🎉</div><h2 style="margin:6px 0">Payment received!</h2><p class="muted">${r.status === "building" ? "Thank you! We're starting on your website now. Watch it come together on your account page." : r.left > 0 ? `Thank you! ${money(r.left)} is left to pay.` : "Thank you! Your website is fully paid. Download it from your account page."}</p><a class="btn" style="margin-top:18px" href="/account.html">Go to my account</a></div>`;
}
async function start() {
  // No order picked (the Billing button on the dashboard): an overview of every order.
  if (!id && !buy) {
    const o = await fetch("/api/orders").then(async (x) => ({ ok: x.ok, status: x.status, ...(await x.json().catch(() => ({}))) }));
    if (o.status === 401) { location.href = "/account.html"; return; }
    const list = (o.orders || []).filter((x) => x.status !== "cancelled");
    const paid = list.reduce((n, x) => n + (x.paid_total || 0), 0);
    const due = (x) => x.status === "awaiting deposit" ? 5 : x.status === "awaiting payment" ? Math.max(0, (x.price || 0) - (x.paid_total || 0)) : 0;
    $("card").innerHTML = `<h2 style="margin:0 0 4px;text-align:left">Billing</h2><p class="muted" style="margin:0 0 16px">Everything you've paid, and anything that's due.</p>
      <div class="lines"><div><span>Paid so far</span><b>${money(paid)}</b></div><div><span>Due now</span><b>${money(list.reduce((n, x) => n + due(x), 0))}</b></div></div>
      ${list.length ? list.map((x) => `<div class="lines" style="margin-top:12px"><div><span><b>${esc(x.kind || "Your website")}</b><br><small class="muted">${esc(x.id)} · ${esc(x.status)}</small></span><b>${money(x.paid_total)} / ${money(x.price)}</b></div>${due(x) ? `<a class="btn" style="width:100%;margin-top:10px;text-align:center" href="/billing.html?id=${encodeURIComponent(x.id)}">Pay ${money(due(x))} →</a>` : ""}</div>`).join("") : '<p class="muted" style="margin-top:14px">No orders yet. <a href="/account.html#req">Request a website</a>.</p>'}`;
    return;
  }
  const r = await fetch("/api/billing?id=" + encodeURIComponent(id) + (buy ? "&buy=" + encodeURIComponent(buy) : "")).then(async (x) => ({ ok: x.ok, status: x.status, ...(await x.json().catch(() => ({}))) }));
  if (r.status === 401) { location.href = "/account.html"; return; }
  if (!r.ok) { $("card").innerHTML = `<h2 style="margin:0 0 8px;text-align:left">Billing</h2><p class="err">${esc(r.error || "Something went wrong.")}</p>`; return; }
  const o = r.order;
  if (!r.amount) {
    $("card").innerHTML = `<h2 style="margin:0 0 8px;text-align:left">Billing · ${esc(o.id)}</h2><p class="muted">${o.status === "in review" ? "We're still looking at your request. You'll get an email when we accept it, and then you can pay here." : "There's nothing to pay right now. Thank you!"}</p><div class="lines"><div><span>Paid so far</span><b>${money(r.paid)}</b></div><div><span>Left to pay</span><b>${money(r.left)}</b></div></div><a class="btn ghost" href="/account.html">Back to my account</a>`;
    return;
  }
  $("card").innerHTML = `
    <span class="tag">${esc(o.id)}</span>
    <h2 style="margin:12px 0 0;text-align:left">${r.due === "deposit" ? "Pay your starting fee" : "Pay for your website"}</h2>
    <p class="muted">${esc(o.kind || "Your website")}</p>
    <div class="amt">${money(r.amount)}</div><p class="muted">${esc(r.label)}${r.due === "deposit" ? " · comes off your price" : ""}</p>
    <div class="lines">
      ${o.promo ? `<div><span>Price before code</span><b><s>${money(o.price_before)}</s></b></div><div><span>Promo ${esc(o.promo)}</span><b style="color:var(--ok)">-${money(o.price_before - o.price)}</b></div>` : ""}
      <div><span>Website price</span><b>${money(o.price)}</b></div>
      <div><span>Paid so far</span><b>${money(r.paid)}</b></div>
      <div><span>Paying now</span><b>${money(r.amount)}</b></div>
      <div><span>Left after this</span><b>${money(Math.max(0, r.left - r.amount))}</b></div>
    </div>
    ${o.promo ? "" : `<form id="promoF" class="row" style="margin-top:4px"><input id="promoIn" placeholder="Promo code" maxlength="24" style="flex:1;min-width:140px;text-transform:uppercase"><button class="btn ghost">Apply</button></form><p class="muted" id="promoMsg" style="font-size:14px;margin-top:6px"></p>`}
    <form id="payF">
      <label class="flab">Card details</label><div id="cardEl" class="fbox"></div>
      <label class="flab">Billing address</label><div id="addrEl" class="fbox"></div>
      <button class="btn paybtn" id="payB" disabled>Pay ${money(r.amount)}</button>
    </form><p class="err" id="err"></p>
    <div class="secure">🔒 Encrypted card payment. Your card details go straight to our secure payment processor, never to our servers.</div>`;
  if ($("promoF")) $("promoF").onsubmit = async (e) => {
    e.preventDefault();
    const c = await post("/api/promo", { id, code: $("promoIn").value });
    if (!c.ok) { $("promoMsg").textContent = c.error || "That code isn't valid."; $("promoMsg").className = "err"; return; }
    start();
  };
  if (!r.stripe) {
    $("payF").innerHTML = r.pay_link ? `<a class="btn paybtn" href="${esc(r.pay_link)}" target="_blank" rel="noopener noreferrer">Pay ${money(r.amount)}</a>` : `<p class="muted">Card payments are being set up. We'll email you as soon as you can pay here.</p>`;
    return;
  }
  const load = () => new Promise((ok, no) => { if (window.Stripe) return ok(); const s = document.createElement("script"); s.src = "https://js.stripe.com/v3/"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  try { await load(); } catch (e) { $("err").textContent = "Couldn't load the card form. Check your internet and refresh."; return; }
  const c = await post("/api/pay/intent", { id, buy });
  if (!c.ok) { $("err").textContent = c.error || "Couldn't start the payment."; return; }
  const stripe = Stripe(r.stripe);
  const elements = stripe.elements({ clientSecret: c.secret, appearance: { theme: "night", variables: { colorPrimary: "#d16cf5", colorBackground: "#100d26", colorText: "#f5f3ff", colorTextSecondary: "#a9a3cf", colorDanger: "#ff8a80", fontFamily: "Inter, system-ui, sans-serif", borderRadius: "12px", spacingUnit: "4px" }, rules: { ".Input": { border: "1px solid rgba(255,255,255,.12)", boxShadow: "none" }, ".Input:focus": { border: "1px solid #d16cf5", boxShadow: "0 0 0 3px rgba(209,108,245,.2)" }, ".Tab": { border: "1px solid rgba(255,255,255,.12)" } } } });
  elements.create("payment", { layout: "tabs", fields: { billingDetails: { address: "never" } }, wallets: { applePay: "auto", googlePay: "auto" } }).mount("#cardEl");
  const addr = elements.create("address", { mode: "billing", defaultValues: { name: r.name || "" } }); addr.mount("#addrEl");
  $("payB").disabled = false;
  $("payF").onsubmit = async (e) => {
    e.preventDefault(); $("err").textContent = ""; $("payB").disabled = true; $("payB").textContent = "Paying…";
    const a = await addr.getValue();
    const res = await stripe.confirmPayment({ elements, redirect: "if_required", confirmParams: { receipt_email: r.email, payment_method_data: { billing_details: { name: a.value.name, email: r.email, address: a.value.address } } } });
    if (res.error) { $("err").textContent = res.error.message || "The payment didn't go through."; $("payB").disabled = false; $("payB").textContent = "Pay " + money(r.amount); return; }
    const k = await post("/api/pay/confirm", { id, buy, pi: res.paymentIntent.id });
    if (k.ok) done(k); else { $("err").textContent = k.error || "We couldn't confirm the payment. Contact us if you were charged."; }
  };
}
start();
</script>
<script src="/help.js" defer></script>
<script src="/lux.js" defer></script>
</body>
</html>
