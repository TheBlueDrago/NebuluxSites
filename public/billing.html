<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#05040f"><meta name="robots" content="noindex">
<title>Billing · Nebulux Sites</title>
<link rel="icon" href="/logo.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lux.css">
<style>
.bill{max-width:560px;margin:6vh auto}
.bill .box{margin:0}
.amt{font-size:56px;font-weight:900;letter-spacing:-.02em;margin:8px 0 2px}
.lines{margin:18px 0;border-top:1px solid var(--line)}.lines div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted)}.lines b{color:var(--text)}
.flab{display:block;font-weight:700;margin:18px 0 8px}.fbox{min-height:44px}.paybtn{width:100%;margin-top:22px;padding:16px;font-size:17px}
.secure{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13px;margin-top:14px}
.done{text-align:center}.done .big{font-size:64px}
</style>
</head>
<body>
<header><a class="logo" href="/account.html#dash"><img src="/logo.png" alt="">Nebulux Sites</a><nav><a href="/account.html">← My account</a></nav></header>
<main class="bill">
  <div class="box" id="card"><p class="muted">Loading…</p></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const id = new URLSearchParams(location.search).get("id") || "";
const buy = new URLSearchParams(location.search).get("buy") || "";
// No connection (or the server didn't answer with JSON): an answer with a plain-words error, so every button says what happened instead of doing nothing.
const NETERR = () => (navigator.onLine === false ? "You're offline. Check your connection and try again." : "Couldn't reach Nebulux Sites. Check your connection and try again.");
const post = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(async (r) => { const d = await r.json().catch(() => ({})); return { ok: r.ok, ...d, ...(!r.ok && !d.error ? { error: r.status >= 500 ? "Something went wrong on our side. Please try again in a minute." : "Something went wrong. Please try again." } : {}) }; }, () => ({ ok: false, error: NETERR() }));
const money = (n) => "$" + Number(n || 0).toFixed(2).replace(/\.00$/, "");
function done(r) {
  if (r.update) { $("card").innerHTML = `<div class="done"><div class="big"><svg class='nx-ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' style='vertical-align:-.125em'><path d='M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z'/></svg></div><h2 style="margin:6px 0">Update paid!</h2><p class="muted">Thanks! We're working on your update and will email you when it's done.</p><a class="btn" style="margin-top:18px" href="/account.html#mon">Back to Monitor</a></div>`; return; }
  if (r.messages) { $("card").innerHTML = `<div class="done"><div class="big"><svg class='nx-ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' style='vertical-align:-.125em'><path d='M21 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.6A8 8 0 1 1 21 12z'/></svg></div><h2 style="margin:6px 0">${r.messages} more messages added!</h2><p class="muted">Go back to your order to keep chatting with us.</p><a class="btn" style="margin-top:18px" href="/account.html#dash">Back to my dashboard</a></div>`; return; }
  $("card").innerHTML = `<div class="done"><div class="big"><svg class='nx-ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' style='vertical-align:-.125em'><circle cx='12' cy='12' r='9'/><path d='m8 12.5 2.7 2.7L16 9.6'/></svg></div><h2 style="margin:6px 0">Payment received!</h2><p class="muted">${r.status === "building" ? "Thank you! We're starting on your website now. Watch it come together on your account page." : r.left > 0 ? `Thank you! ${money(r.left)} is left to pay.` : "Thank you! Your website is fully paid. Download it from your account page."}</p><a class="btn" style="margin-top:18px" href="/account.html">Go to my account</a></div>`;
}
async function start() {
  // No order picked (the Billing button on the dashboard): an overview of every order.
  if (!id && !buy) {
    const o = await fetch("/api/orders").then(async (x) => ({ ok: x.ok, status: x.status, ...(await x.json().catch(() => ({}))) }));
    if (o.status === 401) { location.href = "/account.html"; return; }
    const list = (o.orders || []).filter((x) => x.status !== "cancelled");
    const paid = list.reduce((n, x) => n + (x.paid_total || 0), 0);
    const due = (x) => x.status === "awaiting deposit" ? 5 : x.status === "awaiting payment" ? Math.max(0, (x.price || 0) - (x.paid_total || 0)) : 0;
    $("card").innerHTML = `<h2 style="margin:0 0 4px;text-align:left">Billing</h2><p class="muted" style="margin:0 0 16px">Everything you've paid, and anything that's due.</p>
      <div class="lines"><div><span>Paid so far</span><b>${money(paid)}</b></div><div><span>Due now</span><b>${money(list.reduce((n, x) => n + due(x), 0))}</b></div></div>
      ${list.length ? list.map((x) => `<div class="lines" style="margin-top:12px"><div><span><b>${esc(x.kind || "Your website")}</b><br><small class="muted">${esc(x.id)} · ${esc(x.status)}</small></span><b>${money(x.paid_total)} / ${money(x.price)}</b></div>${due(x) ? `<a class="btn" style="width:100%;margin-top:10px;text-align:center" href="/billing.html?id=${encodeURIComponent(x.id)}">Pay ${money(due(x))} →</a>` : ""}</div>`).join("") : '<p class="muted" style="margin-top:14px">No orders yet. <a href="/account.html#req">Request a website</a>.</p>'}`;
    return;
  }
  const r = await fetch("/api/billing?id=" + encodeURIComponent(id) + (buy ? "&buy=" + encodeURIComponent(buy) : "")).then(async (x) => ({ ok: x.ok, status: x.status, ...(await x.json().catch(() => ({}))) }));
  if (r.status === 401) { location.href = "/account.html"; return; }
  if (!r.ok) { $("card").innerHTML = `<h2 style="margin:0 0 8px;text-align:left">Billing</h2><p class="err">${esc(r.error || "Something went wrong.")}</p>`; return; }
  const o = r.order;
  if (!r.amount) {
    $("card").innerHTML = `<h2 style="margin:0 0 8px;text-align:left">Billing · ${esc(o.id)}</h2><p class="muted">${o.status === "in review" ? "We're still looking at your request. You'll get an email when we accept it, and then you can pay here." : "There's nothing to pay right now. Thank you!"}</p><div class="lines"><div><span>Paid so far</span><b>${money(r.paid)}</b></div><div><span>Left to pay</span><b>${money(r.left)}</b></div></div><a class="btn ghost" href="/account.html">Back to my account</a>`;
    return;
  }
  $("card").innerHTML = `
    <span class="tag">${esc(o.id)}</span>
    <h2 style="margin:12px 0 0;text-align:left">${r.due === "deposit" ? "Pay your starting fee" : "Pay for your website"}</h2>
    <p class="muted">${esc(o.kind || "Your website")}</p>
    <div class="amt">${money(r.amount)}</div><p class="muted">${esc(r.label)}${r.due === "deposit" ? " · comes off your price" : ""}</p>
    <div class="lines">
      ${o.promo ? `<div><span>Price before code</span><b><s>${money(o.price_before)}</s></b></div><div><span>Promo ${esc(o.promo)}</span><b style="color:var(--ok)">-${money(o.price_before - o.price)}</b></div>` : ""}
      <div><span>Website price</span><b>${money(o.price)}</b></div>
      <div><span>Paid so far</span><b>${money(r.paid)}</b></div>
      <div><span>Paying now</span><b>${money(r.amount)}</b></div>
      <div><span>Left after this</span><b>${money(Math.max(0, r.left - r.amount))}</b></div>
    </div>
    ${o.promo ? "" : `<form id="promoF" class="row" style="margin-top:4px"><input id="promoIn" aria-label="Promo code" placeholder="Promo code" maxlength="24" style="flex:1;min-width:140px;text-transform:uppercase"><button class="btn ghost">Apply</button></form><p class="muted" id="promoMsg" style="font-size:14px;margin-top:6px"></p>`}
    <div id="payF"><button class="btn paybtn" id="payB">Pay ${money(r.amount)}</button></div><p class="err" id="err"></p>
    <div class="secure">You pay on Stripe's secure page, with your full billing address. Card, Cash App Pay, Klarna and bank are offered. Your payment details never reach our servers.</div>`;
  if ($("promoF")) $("promoF").onsubmit = async (e) => {
    e.preventDefault();
    const c = await post("/api/promo", { id, code: $("promoIn").value });
    if (!c.ok) { $("promoMsg").textContent = c.error || "That code isn't valid."; $("promoMsg").className = "err"; return; }
    start();
  };
  if (!r.stripe) {
    $("payF").innerHTML = r.pay_link ? `<a class="btn paybtn" href="${esc(r.pay_link)}" target="_blank" rel="noopener noreferrer">Pay ${money(r.amount)}</a>` : `<p class="muted">Payments are being set up. We'll email you as soon as you can pay here.</p>`;
    return;
  }
  // Back from Stripe's checkout, or a bank payment from before: ask whether it has gone through.
  const session = new URLSearchParams(location.search).get("session") || r.pending;
  if (session) {
    const k = await post("/api/pay/confirm", { id, buy, session });
    if (k.ok && !k.processing) { history.replaceState(null, "", "/billing.html?id=" + encodeURIComponent(id) + (buy ? "&buy=" + encodeURIComponent(buy) : "")); done(k); return; }
    $("payF").innerHTML = "";
    $("err").textContent = k.error || "We couldn't confirm the payment. Contact us if you were charged.";
    if (k.processing) return;
    $("payF").innerHTML = `<button class="btn paybtn" id="payB">Pay ${money(r.amount)}</button>`;
  }
  $("payB").onclick = async () => {
    $("err").textContent = ""; $("payB").disabled = true; $("payB").textContent = "Opening checkout…";
    const c = await post("/api/pay/checkout", { id, buy });
    if (c.ok && c.url) { location.href = c.url; return; }
    $("err").textContent = c.error || "Couldn't start the payment. Nothing was charged."; $("payB").disabled = false; $("payB").textContent = "Pay " + money(r.amount);
  };
}
start().catch(() => { $("card").innerHTML = `<p class="muted">${NETERR()}</p><button class="btn" style="margin-top:14px" onclick="location.reload()">Try again</button>`; });
</script>
<script src="/help.js" defer></script>
<script src="/lux.js" defer></script>
</body>
</html>
